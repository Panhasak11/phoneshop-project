databaseChangeLog:
 - changeSet:
     id: 001_init_dbStructure
     author: demboboy111017@gmail.com
     changes:
      - createTable:
          tableName: users
          columns:
            - column:
                name: id
                type: BIGINT
                autoIncrement: true
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: name
                type: VARCHAR(255)
            - column:
                name: firstname
                type: VARCHAR(255)
            - column:
                name: lastname
                type: VARCHAR(255)
            - column:
                name: username
                type: VARCHAR(255)
            - column:
                name: email
                type: VARCHAR(255)
            - column:
                name: password
                type: VARCHAR(255)
            - column:
                name: accountNonExpired
                type: BOOLEAN
            - column:
                name: accountNonLocked
                type: BOOLEAN
            - column:
                name: credentialsNonExpired
                type: BOOLEAN
            - column:
                name: enabled
                type: BOOLEAN